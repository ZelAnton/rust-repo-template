version: 2

# Keep GitHub Actions, Cargo dependencies, and CI-only Python tooling current.
# The github-actions ecosystem bumps action SHAs pinned in workflow files, while
# the cargo and pip ecosystems update their checked-in manifests and locks.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: CI
    groups:
      # One PR per weekly run for all action bumps, instead of one PR per action.
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: Update
    groups:
      # One PR per weekly run for routine bumps keeps the changelog auto-fill tidy.
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /tests/ci-tooling
    schedule:
      interval: weekly
    commit-message:
      prefix: CI
    groups:
      # Keep the yamllint pin and its hashed transitive lock in one review.
      ci-python-tools:
        patterns:
          - "*"
